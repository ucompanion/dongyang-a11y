<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=2" />
    <title>오류안내 - 교직원 수첩</title>
    <!-- 퍼블리싱용 상대경로 css -->
    <link rel="stylesheet" type="text/css" href="../dtis/css/common.css"/>
    <link rel="stylesheet" type="text/css" href="../dtis/css/sub.css"/>
    <script type="text/javascript" src="../dtis/js/jquery/jquery-1.8.3.js"></script>

    <style type="text/css">
        .sub_bg {height: 100vh !important; position: fixed; width: 100%; z-index: -1; background: #f4f4f4;}
        .blind {position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;}
        
        .page_title {position:relative; height:50px; background:#4594db; text-align:center; line-height:50px; color:#fff; font-size:18px;}
        .page_title h1 {margin:0; font-size:18px;}
        .page_title .btn_l {position:absolute; top:0; left:10px; height:50px; display:flex; align-items:center;}
        .page_title .btn_l img {height:20px;}

        .error_msg {display:flex; flex-direction:column; align-items:center; justify-content:center; height:calc(100vh - 50px); text-align:center; padding:20px; box-sizing:border-box;}
        .error_msg img {width:80px; margin-bottom:20px; opacity:0.5;}
        .error_msg p {font-size:16px; color:#555; line-height:1.5; margin:0;}
        .error_msg .btn_home {display:inline-block; margin-top:30px; padding:10px 30px; background:#4594db; color:#fff; text-decoration:none; border-radius:5px; font-size:15px;}
    </style>
</head>
<body class="sub">
    <div class="sub_bg" aria-hidden="true"></div>
    <div id="wrap">
        <header class="page_title">
            <h1>시스템 오류</h1>
            <div class="btn_l"><a href="javascript:history.go(-1);" title="이전 페이지로 이동"><img src="../dtis/images/btn_back.png" alt="이전" /></a></div>
        </header>

        <main class="error_msg" role="alert">
            <img src="../dtis/images/btn_search_del.png" alt="" aria-hidden="true" style="width:60px; height:auto;" />
            <p>
                일시적인 오류가 발생했습니다.<br/>
                잠시 후 다시 시도해 주세요.
            </p>
            <a href="../note/home.html" class="btn_home">메인으로 이동</a>
        </main>
    </div>
</body>
</html>
