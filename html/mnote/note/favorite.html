<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,user-scalable=no" /> 
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>즐겨찾기 - 교직원 수첩</title>
    <link rel="stylesheet" type="text/css" href="../dtis/css/dju_mobile.css"/>
    <script type="text/javascript" src="../dtis/js/jquery-1.11.2.min.js"></script>
    <script type="text/javascript" src="../dtis/js/beta.fix.js"></script>
    <script type="text/javascript" src="../dtis/js/mj.viewport.js"></script>
    <script type="text/javascript" src="../dtis/js/common.js"></script>
    <script type="text/javascript">
        function update(scale) {}
        mj.viewport({ width : 720, onAdjustment : update});
        if (mj.viewport.isIos()) { window.addEventListener("load", function() { update(null); }); }
        window.addEventListener('load', function() { setTimeout(scrollTo, 0, 0, 1); }, false);
    </script>
    <style type="text/css">
        .sub_bg { height:100% !important; }
        .blind { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    </style>
</head>
<body class="sub">
    <div class="sub_bg" aria-hidden="true"></div>
    <div id="wrap">
        <!-- .page_title -->
        <!-- .page_title -->
        <div class="page_title">
            <h1><img src="../dtis/images/icon_logo.gif" alt="" aria-hidden="true">즐겨찾기</h1>
            <div class="btn_l"><a href="home.html" title="이전 페이지로 이동"><img src="../dtis/images/btn_back.png" alt="이전"></a></div>
        </div>
        
        <div class="all_search">
            <div class="search_list" aria-label="즐겨찾기 목록">
                <ul>
                    <li>
                        <dl class="staff_info">
                            <dt>
                                <a href="detail.html" style="text-decoration:none; display:flex; flex-grow:1;" title="김교직원 상세정보 보기">
                                    <p class="thum"><img src="../dtis/images/thum_97_97.png" alt="김교직원 증명사진" /></p>
                                    <div style="flex-grow:1;">
                                        <h3>
                                            김교직원
                                            <span class="favicon" role="button" aria-label="즐겨찾기 해제" tabindex="0">
                                                <img src="../dtis/images/icon_favicon_on.png" alt="즐겨찾기 추가 상태" />
                                            </span>
                                        </h3>
                                        <p class="position">[컴퓨터공학과] 교수</p>
                                    </div>
                                </a>
                            </dt>
                        </dl>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        $(document).ready(function() {
            // 즐겨찾기 해제 기능 (퍼블리싱)
            $(".favicon").on("click keydown", function(e) {
                if(e.type === "click" || e.keyCode === 13 || e.keyCode === 32) {
                    e.preventDefault();
                    if(confirm("즐겨찾기를 해제하시겠습니까?")) {
                        $(this).closest('li').fadeOut(300, function() {
                            $(this).remove();
                        });
                    }
                }
            });
        });
    </script>
</body>
</html>
