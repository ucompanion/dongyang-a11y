<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,user-scalable=no" /> 
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>부서별 조회(2) - 교직원 수첩</title>
    <link rel="stylesheet" type="text/css" href="../dtis/css/dju_mobile.css"/>
    <script type="text/javascript" src="../dtis/js/jquery-1.11.2.min.js"></script>
    <script type="text/javascript" src="../dtis/js/beta.fix.js"></script>
    <script type="text/javascript" src="../dtis/js/mj.viewport.js"></script>
    <script type="text/javascript" src="../dtis/js/common.js"></script>
    <script type="text/javascript">
        function update(scale) {}
        mj.viewport({ width : 720, onAdjustment : update});
        if (mj.viewport.isIos()) { window.addEventListener("load", function() { update(null); }); }
        window.addEventListener('load', function() { setTimeout(scrollTo, 0, 0, 1); }, false);
    </script>
    <style type="text/css">
        .sub_bg {height: 100vh !important; position: fixed; width: 100%; z-index: -1; background: #fff;}
        .blind { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        .detail_info table{width:100%;}
    </style>
</head>

<body class="sub">
    <!-- main_1.jsp는 ajax로 호출되는 fragment지만 퍼블리싱 확인을 위해 단독 페이지로 구성함 -->
    <div class="sub_bg" aria-hidden="true"></div>
    <div id="wrap">
        <section class="content" aria-label="부서 소속 교직원 목록 (fragment)">
            <div style="background:#f9f9f9; padding:10px; text-align:center; color:#555; font-size:12px; border-bottom:1px solid #ddd;">
                이 페이지는 부서별 조회(main) 화면 우측에 Ajax로 로드되는 목록 부분(main_1.jsp)의 퍼블리싱 페이지입니다.
            </div>
            <ul>
                <li>
                    <div class="staff_info">
                        <p class="thum"><a href="detail.html" tabindex="-1"><img src="../dtis/images/thum_97_97.png" alt="" /></a></p>
                        <div class="info_txt">
                            <h3>
                                <a href="detail.html" style="text-decoration:none; color:inherit;">김교수</a>
                                <span class="favicon" role="button" aria-label="즐겨찾기 해제/추가" tabindex="0">
                                    <img src="../dtis/images/icon_favicon_off.png" alt="즐겨찾기 해제 상태" />
                                </span>
                            </h3>
                            <p class="position">[컴퓨터공학과] 교수</p>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="staff_info">
                        <p class="thum"><a href="detail.html" tabindex="-1"><img src="../dtis/images/dummy_photo.png" alt="" /></a></p>
                        <div class="info_txt">
                            <h3>
                                <a href="detail.html" style="text-decoration:none; color:inherit;">이조교</a>
                                <span class="favicon" role="button" aria-label="즐겨찾기 해제/추가" tabindex="0">
                                    <img src="../dtis/images/icon_favicon_on.png" alt="즐겨찾기 추가 상태" />
                                </span>
                            </h3>
                            <p class="position">[컴퓨터공학과] 조교</p>
                        </div>
                    </div>
                </li>
            </ul>
        </section>
    </div>

    <script type="text/javascript">
        $(document).ready(function() {
            // 즐겨찾기 토글
            $(".favicon").on("click keydown", function(e) {
                if(e.type === "click" || e.keyCode === 13 || e.keyCode === 32) {
                    e.preventDefault();
                    var $img = $(this).find("img");
                    var src = $img.attr("src");
                    if(src.indexOf("off") > -1) {
                        $img.attr("src", src.replace("off", "on")).attr("alt", "즐겨찾기 추가 상태");
                    } else {
                        $img.attr("src", src.replace("on", "off")).attr("alt", "즐겨찾기 해제 상태");
                    }
                }
            });
        });
    </script>
</body>
</html>
