<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=2" />
    <title>검색 - 교직원 수첩</title>
    <!-- 퍼블리싱용 상대경로 css -->
    <link rel="stylesheet" type="text/css" href="../dtis/css/common.css"/>
    <link rel="stylesheet" type="text/css" href="../dtis/css/sub.css"/>
    <script type="text/javascript" src="../dtis/js/jquery/jquery-1.8.3.js"></script>

    <style type="text/css">
        .sub_bg {
            height: 100vh !important;
            position: fixed;
            width: 100%;
            z-index: -1;
            background: #f4f4f4;
        }

        .blind {
            position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
        }
        
        .page_title {position:relative; height:50px; background:#4594db; text-align:center; line-height:50px; color:#fff; font-size:18px;}
        .page_title h1 {margin:0; font-size:18px;}
        .page_title h1 img {vertical-align:middle; margin-right:5px; margin-top:-3px;}
        .page_title .btn_l {position:absolute; top:0; left:10px; height:50px; display:flex; align-items:center;}
        .page_title .btn_l img {height:20px;}

        .all_search {padding:15px;}
        .all_search .search {position:relative; height:40px; background:#fff; border:2px solid #4594db; border-radius:20px; overflow:hidden;}
        .all_search .search input {width:calc(100% - 60px); height:40px; border:0; background:transparent; padding:0 10px 0 20px; font-size:14px; box-sizing:border-box; outline:none;}
        .all_search .search .btn {position:absolute; right:10px; top:10px; cursor:pointer;}
        
        .search_list {margin-top:20px;}
        .search_list ul li {background:#fff; border:1px solid #ddd; margin-bottom:10px; padding:15px; border-radius:8px;}
        .search_list ul li dl dt {display:flex; align-items:center;}
        .search_list ul li dl dt .thum {width:50px; height:50px; border-radius:50%; overflow:hidden; margin-right:15px;}
        .search_list ul li dl dt .thum img {width:100%; height:100%; object-fit:cover;}
        .search_list ul li dl dt h3 {margin:0 0 5px 0; font-size:16px; color:#333; display:flex; align-items:center; justify-content:space-between;}
        .search_list ul li dl dt h3 .favicon {cursor:pointer;}
        .search_list ul li dl dt h3 .favicon img {width:20px;}
        .search_list ul li dl dt .position {margin:0; font-size:13px; color:#777;}
    </style>
</head>

<body class="sub" id="topbody">
    <div class="sub_bg" aria-hidden="true"></div>
    <div id="wrap">
        <!-- .page_title -->
        <header class="page_title">
            <h1><img src="../dtis/images/icon_logo.gif" alt="" aria-hidden="true">검색</h1>
            <div class="btn_l"><a href="home.html" title="이전 페이지로 이동"><img src="../dtis/images/btn_back.png" alt="이전"></a></div>
        </header>
        
        <!-- .all_search -->
        <main class="all_search">
            <section class="search">
                <form action="javascript:void(0);" onsubmit="dummySearch();">
                    <fieldset>
                        <legend class="blind">교직원 검색</legend>
                        <label for="txt_search" class="blind">검색어 입력</label>
                        <input type="text" id="txt_search" name="txt_search" maxlength="10" placeholder="이름, 부서명 입력" title="검색어를 입력하세요"/>
                        <button type="submit" class="btn" style="border:0; background:transparent;" title="검색"><img src="../dtis/images/btn_search2.png" alt="검색" /></button>
                    </fieldset>
                </form>
            </section>
            
            <!-- .search_list -->
            <section class="search_list" aria-live="polite">
                <ul id="ul_search_list_result">
                    <!-- 검색 결과 더미 데이터 -->
                    <li>
                        <dl class="staff_info">
                            <dt>
                                <a href="detail.html" style="text-decoration:none; display:flex; flex-grow:1;" title="김교직원 상세정보 보기">
                                    <p class="thum"><img src="../dtis/images/thum_97_97.png" alt="김교직원 증명사진" /></p>
                                    <div style="flex-grow:1;">
                                        <h3>
                                            김교직원
                                            <span class="favicon" role="button" aria-label="즐겨찾기 추가/해제" tabindex="0">
                                                <img src="../dtis/images/icon_favicon_off.png" alt="즐겨찾기 해제 상태" />
                                            </span>
                                        </h3>
                                        <p class="position">[컴퓨터공학과]&nbsp;&nbsp;&nbsp;교수</p>
                                    </div>
                                </a>
                            </dt>
                        </dl>
                    </li>
                </ul>
            </section>
        </main>
    </div>

    <script type="text/javascript">
        function dummySearch() {
            alert("퍼블리싱용 더미 검색 기능입니다.");
        }

        $(document).ready(function() {
            // 즐겨찾기 토글 기능 (퍼블리싱)
            $(".favicon").on("click keydown", function(e) {
                if(e.type === "click" || e.keyCode === 13 || e.keyCode === 32) {
                    e.preventDefault();
                    var $img = $(this).find("img");
                    var src = $img.attr("src");
                    if(src.indexOf("off") > -1) {
                        $img.attr("src", src.replace("off", "on")).attr("alt", "즐겨찾기 추가 상태");
                    } else {
                        $img.attr("src", src.replace("on", "off")).attr("alt", "즐겨찾기 해제 상태");
                    }
                }
            });
        });
    </script>
</body>
</html>
