<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=2" />
    <title>비밀번호 재확인 - 동양미래대학교 모바일 캠퍼스</title>
    <!-- 퍼블리싱용 상대경로 css -->
    <link rel="stylesheet" type="text/css" href="../dtis/css/common.css" />
    <link rel="stylesheet" type="text/css" href="../dtis/css/board.css" />
    <link rel="stylesheet" type="text/css" href="../dtis/js/jquery.slidebars/slidebars.css">

    <style type="text/css">
        #header {
            z-index: 300;
            top: 0;
            left: 0;
            position: fixed;
            height: 50px;
            width: 100%;
        }

        #wrapper.main #header {
            height: 50px;
        }

        #contents h1 {
            position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            height: 43px;
            /* [A11y: 명도 대비] 흰색 텍스트와 대비(4.5:1 이상) 준수를 위해 기존 #4594db에서 어두운 톤으로 변경 */
            background-color: #2a659c;
            text-align: center;
            font-size: 16px;
            color: #fff;
            line-height: 43px;
        }

        .blind,
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>

    <!-- jQuery 등 스크립트 -->
    <script type="text/javascript" src="../dtis/js/jquery/jquery-1.8.3.js"></script>
    <script type="text/javascript" src="../dtis/js/jquery.slidebars/slidebars.js"></script>
    <link rel="stylesheet" type="text/css" href="../dtis/css/high-contrast.css" />
</head>

<body>
    <div id="sb-site">
        <div id="wrapper">
            <!-- header (incHeader.jsp 병합) -->
            <div id="header">
                <div>
                    <!-- [A11y: 대체 텍스트] 헤더 기능 버튼(메뉴, 로그아웃)에 숨김 텍스트(.blind) 제공 -->
                    <!-- [A11y: 초점 이동] 메뉴 -> 로고 -> 로그아웃 순으로 DOM 재배치하여 논리적 초점 이동 보장 -->
                    <button type="button" class="bt menu sb-toggle-left" title="전체 메뉴 열기"><span class="blind">전체메뉴</span></button>
                    <!-- [A11y: 대체 텍스트] 헤더 로고 링크 대체 텍스트 강화 -->
                    <a href="../main/default.html" title="메인 페이지로 이동" aria-label="동양미래대학교 홈으로 이동"><span
                            class="logo"></span></a>
                    <!-- 로그인 상태 (퍼블리싱 더미) -->
                    <!-- [A11y: 사용자 요구에 따른 실행] 로그아웃 시 confirm(확인 창)이 발생함을 사용자에게 사전 경고(title 속성) -->
                    <!-- [A11y: 의미에 맞는 마크업] 로그아웃 요소를 button 태그로 사용하여 접근성 확보 -->
                    <button type="button" class="bt logout" title="로그아웃 (확인 창 열림)"><span
                            class="blind">로그아웃</span></button>
                </div>
                <div class="shadow"></div>
            </div>

            <!-- content -->
            <div id="contents">
                <div class="shadow"></div>
                <h1>비밀번호 재확인</h1>
                <div class="wrapContainer login">
                    <div class="loginWrap pwd">
                        <fieldset>
                            <!-- [A11y: 레이블과 네임] 폼 요소(아이디/비밀번호 등)에 스크린 리더용 숨김 레이블(.blind) 제공 -->
                            <legend class="blind">비밀번호 확인 입력폼</legend>
                            <div class="viusalTitle" aria-hidden="true"></div>
                            <p style="margin-bottom:15px; font-size:14px; color:#555; line-height:1.4;">
                                개인정보를 제공하는 메뉴입니다.<br>
                                <strong>개인정보보호를 위해 비밀번호를 다시 한번 입력하고 확인</strong>해 주시기 바랍니다.
                            </p>
                            <ul>
                                <li>
                                    <label for="passwd" class="blind">비밀번호</label>
                                    <input id="passwd" type="password" placeholder="Password" title="비밀번호를 입력하세요">
                                </li>
                            </ul>
                        </fieldset>
                        <div class="buttonArea" style="margin-top:15px;">
                            <button type="button" onclick="location.href='../stf/STF_00.html'"
                                style="background: none !important; background-color: #003cab !important; width:100%; border:0; color:#fff; font-size:16px; padding:10px 0;">확인</button>
                        </div>
                    </div>
                </div>
                <input type="hidden" id="redirectUrl" value="" />
            </div>
        </div>
    </div>

    <!-- side menu (incSideMenu.jsp 병합) -->
    <!-- [A11y: Guide 05 초점 이동] 전체메뉴 열림 시 논리적 초점 이동을 위해 tabindex="0" 부여 -->
    <div class="sb-slidebar sb-left sb-style-push sb-width-custom" data-sb-width="80%" tabindex="0">
        <div id="menuWrap">
            <div class="searchArea">
                <label for="searchWord" class="blind">메뉴 검색</label>
                <input type="text" id="searchWord" name="searchWord" placeholder="검색어 입력" />
                <button type="button" class="bt_search" title="검색"><span class="blind">검색</span></button>
            </div>
            <a href="../main/default.html" class="logo-link">
                <div class="logo"><span class="blind">동양미래대학교 모바일 캠퍼스</span></div>
            </a>
            <ul class="personalIcon">
                <li class="m01">
                    <a href="../stf/STF_00.html" class="sb-close"><span>개인정보</span></a>
                </li>
                <li class="m02">
                    <a href="../main/config.html" class="sb-close"><span>환경설정</span></a>
                </li>
                <!-- [A11y: 의미 없는 요소 숨김] 일반 모드 4단 레이아웃 유지를 위한 빈칸으로, 스크린 리더에서 무시되도록 처리 -->
                <li aria-hidden="true"></li>
                <li aria-hidden="true"></li>
            </ul>
            <!-- [A11y: 초점 이동] 전체메뉴 닫기 버튼 제공 및 클래스(sb-close)를 통한 포커스 복귀 연동 -->
            <button type="button" class="sb-close btn_close_menu"><span class="blind">전체메뉴 닫기</span></button>

        </div>
    </div>

    <div id="site_mask"
        style="width:100%;z-index:9000;background:#fff;opacity:0.0;position:absolute;top:0;left:80%; display:none;">
    </div>

    <script type="text/javascript">
        $(document).ready(function(){
            $.slidebars();
        });
    </script>
</body>

</html>
