<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=2" />
    <title>회원 로그인 - 동양미래대학교 모바일 캠퍼스</title>
    <!-- 퍼블리싱용 상대경로 css -->
    <link rel="stylesheet" type="text/css" href="../dtis/css/common.css"/>
    <link rel="stylesheet" type="text/css" href="../dtis/css/board.css"/>
    <link rel="stylesheet" type="text/css" href="../dtis/js/jquery.slidebars/slidebars.css">
    
    <style type="text/css">
        #header {z-index: 300; top: 0; left: 0; position: fixed; height: 50px; width: 100%;}
        #wrapper.main #header {height: 50px;}
        #contents h1 {position: absolute; top: 50px; left: 0; width: 100%; height: 43px; background-color: #4594db; text-align: center; font-size: 16px; color: #fff; line-height: 43px;}
        
        .blind, .sr-only {position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;}
    </style>
    
    <!-- jQuery 등 스크립트 -->
    <script type="text/javascript" src="../dtis/js/jquery/jquery-1.8.3.js"></script>
    <script type="text/javascript" src="../dtis/js/jquery.slidebars/slidebars.js"></script>
</head>

<body>
    <div id="sb-site">
        <div id="wrapper">
            <!-- header (incHeader.jsp 병합) -->
            <header id="header">
                <div>
                    <a href="main/default.html" title="메인 페이지로 이동"><span class="logo"></span></a>
                    <button type="button" class="bt menu sb-toggle-left" title="전체 메뉴 열기"><span class="blind">메뉴 열기</span></button>
                    <!-- 로그인 상태 (퍼블리싱 더미) -->
                    <button type="button" class="bt login" title="로그인"><span class="blind">로그인</span></button>
                </div>
                <div class="shadow"></div>    
            </header>
            
            <!-- content -->
            <main id="contents">
                <div class="shadow"></div>
                <h1 style="background-color: #003cab !important">
                    회원 로그인
                    <span id="appVersion" style="position:absolute; right:10px;">Ver 1.0.0</span>
                </h1> 
                
                <section class="wrapContainer login">
                    <div class="loginWrap">
                        <!-- 로그인 폼 시작 -->
                        <form name="frmLogin" method="post" action="main/default.html">
                            <fieldset>
                                <legend class="blind">로그인 입력폼</legend>
                                <ul>
                                    <li>
                                        <label for="userid" class="blind">아이디</label>
                                        <input type="text" id="userid" name="username" placeholder="User ID" title="아이디를 입력하세요">
                                    </li>
                                    <li>
                                        <label for="passwd" class="blind">비밀번호</label>
                                        <input type="password" id="passwd" name="password" placeholder="Password" title="비밀번호를 입력하세요">
                                    </li>
                                </ul>
                            </fieldset>
                            
                            <ul class="login_chk">
                                <!-- 접근성 향상: label 연결 -->
                                <li class="chk" style="font-size:14px; position:relative;">
                                    <input type="checkbox" id="chk_idsave" style="position:absolute; top:2px; left:0; z-index:-1; opacity:0;"/>
                                    <label for="chk_idsave" id="idsave_chk" style="cursor:pointer; display:block; padding-left:25px; min-height:22px;">아이디 저장</label>
                                </li>
                                <li class="chk" style="font-size:14px; position:relative;">
                                    <input type="checkbox" id="chk_autologin" style="position:absolute; top:2px; left:0; z-index:-1; opacity:0;"/>
                                    <label for="chk_autologin" id="autologin_chk" style="cursor:pointer; display:block; padding-left:25px; min-height:22px;">자동 로그인</label>
                                </li>
                            </ul>
                            
                            <div class="buttonArea">
                                <button type="submit" style="background: none !important; background-color: #003cab !important; width:100%; border:0; color:#fff; font-size:16px; padding:10px 0;">로그인</button>
                                <p style="margin-top:15px; color:#555; text-align:center; font-size:13px; line-height:1.5;">아이디, 비밀번호는 우리대학 홈페이지의<br/>사용자 아이디, 비밀번호와 동일합니다.</p>
                            </div>
                        </form>
                    </div>
                </section>
            </main>
        </div>
    </div>
    
    <!-- side menu (incSideMenu.jsp 병합) -->
    <div class="sb-slidebar sb-left sb-style-push sb-width-custom" data-sb-width="80%">
        <div id="menuWrap">
            <div class="searchArea">
                <label for="searchWord" class="blind">메뉴 검색</label>
                <input type="text" id="searchWord" name="searchWord" placeholder="검색어 입력"/>
                <button type="button" class="bt_search" title="검색"><span class="blind">검색</span></button>
            </div>
            <a href="main/default.html"><div class="logo"><span class="blind">동양미래대학교 모바일 캠퍼스</span></div></a>
            <ul class="personalIcon">
                <li class="m01">
                    <a href="stf/STF_00.html" class="sb-close"><span>개인정보</span></a>
                </li>
                <li class="m02">
                    <a href="main/config.html" class="sb-close"><span>환경설정</span></a>
                </li>
            </ul>
        </div>
    </div>    
    <div id="site_mask" style="width:100%;z-index:9000;background:#fff;opacity:0.0;position:absolute;top:0;left:80%; display:none;"></div>

    <script type="text/javascript">
        $(document).ready(function(){
            $.slidebars();
            
            // 퍼블리싱용 디자인 체크박스 동작
            $("#idsave_chk").on("click", function(){
                $(this).toggleClass("on");
            });
            $("#autologin_chk").on("click", function(){
                $(this).toggleClass("on");
                if($(this).hasClass("on")) {
                    $("#idsave_chk").addClass("on");
                    $("#chk_idsave").prop("checked", true);
                }
            });
        });
    </script>
</body>
</html>
