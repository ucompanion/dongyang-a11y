<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width,user-scalable=1,initial-scale=1,minimum-scale=1,maximum-scale=2" />
    <title>도서관 이용증 - 동양미래대학교 모바일 캠퍼스</title>
    <!-- 퍼블리싱용 상대경로 css -->
    <link rel="stylesheet" type="text/css" href="../dtis/css/common.css" />
    <link rel="stylesheet" type="text/css" href="../dtis/css/board.css" />
    <link rel="stylesheet" type="text/css" href="../dtis/js/jquery.slidebars/slidebars.css">

    <style type="text/css">
        #top_logo {
            display: block;
            margin: 0 auto;
            width: 300px;
            height: 100px;
        }

        #top_logo img {
            margin-top: 30px;
            width: 100%;
            height: 50%;
        }

        .page_title {
            padding: 10px 0 10px 0;
        }

        .wrap.main {
            background: rgb(44 106 191);
        }

        .wrap.main .card_box .title {
            color: rgb(44 106 191);
            font-size: 27px;
            font-weight: 700;
        }

        .main .content {
            background: #fff;
            border-radius: 50px 50px 0 0;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .card_box.main {
            background: rgb(44 106 191);
        }

        .card_box .namebox {
            width: 70%;
            margin: auto;
            margin-bottom: 30px;
            background: rgb(229 241 255);
            border-radius: 15px;
        }

        .card_box .nametable {
            margin: auto;
            border-spacing: 15px;
            font-size: 1em;
            font-weight: bold;

        }

        .card_box .nametable td {
            text-align: left;
        }

        .card_box .nametable td:first-child {
            width: 35px;
            padding-right: 15px;
        }

        .card_box #qrcode {
            padding: 10px 0;
            cursor: pointer;
        }

        .card_box .picbox {
            margin: 0 auto;
            width: 230px;
            height: 230px;
            border: 2px solid rgb(229 241 255);
            border-radius: 50%;
            box-shadow: 0px 0px 10px 1px rgb(229 241 255);
        }

        .card_box .picbox .pic {
            margin-top: 38px;
            height: 160px;
            max-height: 160px;
        }

        .card_box .picbox .pic img {
            height: 160px;
        }

        .content .footer_box {
            padding-right: 20px;
            position: absolute;
            right: 9px;
            height: 20px;
            background: rgb(44 106 191);
        }

        .content .footer_box .blind:before,
        .content .footer_box .blind:after {
            position: absolute;
            right: 9px;
            content: ' ';
            height: 20px;
            width: 2px;
            background-color: #fff;
        }

        .content .footer_box .blind:before {
            transform: rotate(45deg);
        }

        .content .footer_box .blind:after {
            transform: rotate(-45deg);
        }
    </style>

    <script type="text/javascript" src="../dtis/js/jquery/jquery-1.8.3.js"></script>
    <script type="text/javascript" src="../dtis/js/jquery.slidebars/slidebars.js"></script>
    <script type="text/javascript" src="../dtis/js/jquery/jquery-qrcode-0.18.0.min.js"></script>
</head>

<body id="body">
    <div id="sb-site">
        <div class="wrap main">

            <div class="page_title">
                <div id="top_logo">
                    <img src="../dtis/images/white_logo.png" alt="동양미래대학교">
                </div>
            </div>

            <section class="content">
                <article class="card_box">
                    <h3 class="title">도서관 이용증</h3>
                    <div class="picbox">
                        <div class="pic photo">
                            <img id="pic_img" src="../dtis/images/dummy_photo.png" alt="학생 증명사진"
                                onerror="this.src='../dtis/images/default_stu_img.png'">
                        </div>
                        <div class="pic qrcode" style="display: none;" aria-hidden="true">
                            <!-- QR 코드 렌더링 영역 -->
                        </div>
                    </div>

                    <!-- QR 코드 토글 버튼 -->
                    <div id="qrcode" style="cursor:pointer;">
                        <img src="../dtis/images/qrcode_s.png" alt="QR코드 보기 토글" />
                    </div>

                    <div class="namebox">
                        <table class="nametable">
                            <tbody>
                                <tr>
                                    <td>사번</td>
                                    <td class="class_no">2000901</td>
                                </tr>
                                <tr>
                                    <td>소속</td>
                                    <td class="club">종합정보지원실</td>
                                </tr>
                                <tr>
                                    <td>이름</td>
                                    <td class="name">박민철</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </article>
                <div class="footer_box">
                    <span class="blind"></span>
                </div>
            </section>
        </div>
    </div>

    <!-- side menu (incSideMenu.jsp 병합) -->
    <div class="sb-slidebar sb-left sb-style-push sb-width-custom" data-sb-width="80%">
        <div id="menuWrap">
            <div class="searchArea">
                <label for="searchWord" class="blind">메뉴 검색</label>
                <input type="text" id="searchWord" name="searchWord" placeholder="검색어 입력" />
                <button type="button" class="bt_search" title="검색"><span class="blind"></span></button>
            </div>
            <a href="../main/default.html">
                <div class="logo"><span class="blind"></span></div>
            </a>
            <ul class="personalIcon">
                <li class="m01">
                    <a href="#" class="sb-close"><span>개인정보</span></a>
                </li>
                <li class="m02">
                    <a href="../main/config.html" class="sb-close"><span>환경설정</span></a>
                </li>
            </ul>
        </div>
    </div>
    <div id="site_mask"
        style="width:100%;z-index:9000;background:#fff;opacity:0.0;position:absolute;top:0;left:80%; display:none;">
    </div>

    <script type="text/javascript">
        $(document).ready(function () {
            $.slidebars();

            // 더미 QR 코드 생성
            if ($.fn.qrcode) {
                var qr_options = {
                    render: 'canvas',
                    ecLevel: 'L',
                    size: 150,
                    fill: '#000',
                    text: 'DUMMY_QR_CODE'
                };
                $(".pic.qrcode").qrcode(qr_options);
            }
        });

        $("#qrcode").click(function (e) {
            qrCodeSwich();
        });

        function qrCodeSwich() {
            if ($(".pic.photo").css('display') === 'none') {
                $(".pic.photo").show().attr("aria-hidden", "false");
                $(".pic.qrcode").hide().attr("aria-hidden", "true");
            } else {
                $(".pic.photo").hide().attr("aria-hidden", "true");
                $(".pic.qrcode").show().attr("aria-hidden", "false");
            }
        }
    </script>
</body>

</html>
