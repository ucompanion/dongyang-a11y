<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,user-scalable=1,initial-scale=1,minimum-scale=1,maximum-scale=2" />
    <title>도서관 이용증 - 동양미래대학교 모바일 캠퍼스</title>
    <!-- 퍼블리싱용 상대경로 css -->
    <link rel="stylesheet" type="text/css" href="../dtis/css/common.css"/>
    <link rel="stylesheet" type="text/css" href="../dtis/css/board.css"/>
    <link rel="stylesheet" type="text/css" href="../dtis/js/jquery.slidebars/slidebars.css">

    <style type="text/css">
        /* incHeader.jsp & incTop.jsp 공통 스타일 병합 */
        #header {z-index: 300; top: 0; left: 0; position: fixed; height: 50px; width: 100%; background: url("../dtis/images/bg_header.png") center 0 no-repeat; background-size: 100% 50px;}
        #wrapper.main #header {height: 50px;}
        #header h1 {position: absolute; bottom: 0; left: 0; width: 100%; height: 43px; background-color: #4594db; text-align: center; font-size: 16px; color: #fff; line-height: 43px;}

        /* A11y: 숨김 텍스트 클래스 */
        .blind, .sr-only {
            position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
        }

        #top_logo { display: block; margin: 0 auto; width: 300px; height: 100px; padding-top: 50px; }
        #top_logo img { margin-top: 30px; width: 100%; height: 50%; }
        
        .page_title { padding: 10px 0 10px 0; }
        
        .wrap.main {background: rgb(44, 106, 191); min-height: 100vh;}
        .wrap.main .card_box .title {color: rgb(44, 106, 191); font-size: 27px; padding: 20px 0;}
        .main .content { background: #fff; border-radius: 50px 50px 0 0; text-align: center; overflow: hidden; position: relative; padding-bottom: 30px;}
        
        .card_box.main {background: rgb(44, 106, 191);}
        .card_box .namebox { width: 70%; margin: auto; margin-bottom: 30px; background: rgb(229, 241, 255); border-radius: 15px; padding: 15px;}
        .card_box .nametable { margin: auto; border-spacing: 15px; font-size:1em; font-weight: bold;}
        .card_box .nametable td { text-align: left; }
        .card_box .nametable td:first-child { width: 35px; padding-right: 15px; }
        .card_box #qrcode { padding: 10px 0; cursor: pointer; }
        .card_box .picbox { margin: 0 auto; width: 230px; height: 230px; border: 2px solid rgb(229, 241, 255); border-radius: 50%; box-shadow: 0px 0px 10px 1px rgb(229, 241, 255); overflow: hidden; display: flex; align-items: center; justify-content: center;}
        .card_box .picbox .pic { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;}
        .card_box .picbox .pic img { max-height: 160px; }

        .content .footer_box {padding-right: 20px; position: absolute; right: 9px; bottom: 0; height: 20px; width: 100%; background: rgb(44, 106, 191);}
    </style>
    
    <script type="text/javascript" src="../dtis/js/jquery/jquery-1.8.3.js"></script>
    <script type="text/javascript" src="../dtis/js/jquery.slidebars/slidebars.js"></script>
    <script type="text/javascript" src="../dtis/js/jquery/jquery-qrcode-0.18.0.min.js"></script>
</head>

<body id="body">
    <div id="sb-site">
        <div class="wrap main">
            <!-- header (incHeader.jsp 병합) -->
            <header id="header">
                <div>
                    <a href="../main/default.html" title="메인 페이지로 이동"><span class="logo"></span></a>
                    <button type="button" class="bt menu sb-toggle-left" title="전체 메뉴 열기"><span class="blind">메뉴 열기</span></button>
                    <!-- 로그인 상태 (퍼블리싱 더미) -->
                    <button type="button" class="bt logout" title="로그아웃"><span class="blind">로그아웃</span></button>
                </div>
            </header>

            <div class="page_title">
                <div id="top_logo">
                    <img src="../dtis/images/white_logo.png" alt="동양미래대학교">
                </div>
            </div>
            
            <main class="content">
                <article class="card_box">
                    <h2 class="title">도서관 이용증</h2>
                    <div class="picbox">
                        <div class="pic photo">
                            <img id="pic_img" src="../dtis/images/dummy_photo.png" alt="학생 증명사진">
                        </div>
                        <div class="pic qrcode" style="display: none;" aria-hidden="true">
                            <!-- QR 코드 렌더링 영역 -->
                        </div>
                    </div>
                    
                    <!-- QR 코드 토글 버튼 -->
                    <button type="button" id="qrcode" style="border:0; background:transparent;">
                        <img src="../dtis/images/qrcode_s.png" alt="QR코드 보기 토글"/>
                    </button>

                    <div class="namebox">
                        <table class="nametable">
                            <caption>학생 정보: 학번, 소속, 이름 정보 제공</caption>
                            <tbody>
                                <tr>
                                    <th scope="row">학번</th>
                                    <td class="class_no">20230001</td>
                                </tr>    
                                <tr>
                                    <th scope="row">소속</th>
                                    <td class="club">컴퓨터공학과</td>
                                </tr>    
                                <tr>
                                    <th scope="row">이름</th>
                                    <td class="name">김학생</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </article>
                <div class="footer_box" aria-hidden="true"></div>
            </main>
        </div>
    </div>
    
    <!-- side menu (incSideMenu.jsp 병합) -->
    <div class="sb-slidebar sb-left sb-style-push sb-width-custom" data-sb-width="80%">
        <div id="menuWrap">
            <div class="searchArea">
                <label for="searchWord" class="blind">메뉴 검색</label>
                <input type="text" id="searchWord" name="searchWord" placeholder="검색어 입력"/>
                <button type="button" class="bt_search" title="검색"><span class="blind">검색</span></button>
            </div>
            <a href="../main/default.html"><div class="logo"><span class="blind">동양미래대학교 모바일 캠퍼스</span></div></a>
            <ul class="personalIcon">
                <li class="m01">
                    <a href="#" class="sb-close"><span>개인정보</span></a>
                </li>
                <li class="m02">
                    <a href="../main/config.html" class="sb-close"><span>환경설정</span></a>
                </li>
            </ul>
        </div>
    </div>    
    <div id="site_mask" style="width:100%;z-index:9000;background:#fff;opacity:0.0;position:absolute;top:0;left:80%; display:none;"></div>

    <script type="text/javascript">
        $(document).ready(function(){
            $.slidebars();
            
            // 더미 QR 코드 생성
            if($.fn.qrcode) {
                var qr_options = {
                    render: 'canvas',
                    ecLevel: 'L',
                    size: 150,
                    fill: '#000',
                    text: 'DUMMY_QR_CODE'
                };
                $(".pic.qrcode").qrcode(qr_options);
            }
        });
        
        $("#qrcode").click(function(e){
            qrCodeSwich();
        });

        function qrCodeSwich(){
            if($(".pic.photo").css('display') === 'none'){
                $(".pic.photo").show().attr("aria-hidden", "false");
                $(".pic.qrcode").hide().attr("aria-hidden", "true"); 
            }else{
                $(".pic.photo").hide().attr("aria-hidden", "true");
                $(".pic.qrcode").show().attr("aria-hidden", "false");
            }
        }
    </script>
</body>
</html>
